# =====================================================
#                  CLAN CORE
# =====================================================

clan:
  min-name-length: 3
  max-name-length: 16
  creation-cost: 1000
  rename-cost: 500
  max-members: 10

# =====================================================
#                  CLAN CHAT
# =====================================================

chat:
  format: "&8[&a{clan}&8] &f{player} &7» &f{message}"
  toggle-on: "&aКлановый чат включён."
  toggle-off: "&cКлановый чат выключён."

# =====================================================
#                  CLAN HOME
# =====================================================

home:
  enabled: true
  teleport-delay: 5
  teleport-cancel-move: true
  set-success: "&aДом клана установлен."
  teleport: "&aТелепортация в дом клана..."
  not-set: "&cДом клана не установлен."

# =====================================================
#                  CLAN PVP
# =====================================================

pvp:
  friendly-fire-default: false
  block-message: "&cНельзя использовать клановые команды во время PvP!"

# =====================================================
#                  CLAN STORAGE
# =====================================================

storage:
  default-slots: 9          # стартовое хранилище (1 уровень)
  slots-per-level: 9        # +9 слотов за уровень
  max-slots: 54             # максимум (6 рядов)

# =====================================================
#                  CLAN STORAGE UPGRADE
# =====================================================

upgrade:
  max-level: 5
  prices:
    2: 200000
    3: 600000
    4: 1500000
    5: 3000000
    6: 6000000

messages:
  storage-max: "&aХранилище клана достигло максимального уровня!"
  storage-upgraded: "&aХранилище улучшено до уровня &e{level}"
  storage-next-price: "&7Цена следующего уровня: &6{price}"
  not-enough-money: "&cНедостаточно средств в банке клана."