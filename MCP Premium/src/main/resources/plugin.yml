name: VaultEconomy
version: 1.0.4
main: me.kodysimpson.vaulteconomy.VaultEconomy
api-version: 1.13

depend:
  - Vault

# =====================================================
#                     COMMANDS
# =====================================================
commands:
  clan:
    description: Кланы
    usage: /clan
    aliases: [ cl ]
    permission: vaulteconomy.clan

  # ===== ЭКОНОМИКА =====
  bits:
    description: Баланс
    aliases: [bal, balance, money]
    permission: vaulteconomy.balance

  baltop:
    description: Топ по балансу
    aliases: [top]
    permission: vaulteconomy.baltop

  point:
    description: Кастомные валюты
    permission: vaulteconomy.point.use

  # ===== СПАВН / ДОМА / ВАРПЫ =====
  spawn:
    description: Телепорт на спавн
    permission: vaulteconomy.spawn

  setspawn:
    description: Установить спавн
    permission: vaulteconomy.spawn.set

  home:
    description: Телепорт домой
    permission: vaulteconomy.home

  sethome:
    description: Установить дом
    permission: vaulteconomy.sethome

  delhome:
    description: Удалить дом
    permission: vaulteconomy.delhome

  homelist:
    description: Список домов
    permission: vaulteconomy.homelist

  warp:
    description: Телепорт на варп
    permission: vaulteconomy.warp

  warplist:
    description: Список варпов
    permission: vaulteconomy.warplist

  setwarp:
    description: Установить варп
    permission: vaulteconomy.setwarp

  delwarp:
    description: Удалить варп
    permission: vaulteconomy.delwarp

  back:
    description: Вернуться назад
    permission: vaulteconomy.back

  # ===== ТЕЛЕПОРТЫ =====
  tp:
    description: Телепорт к игроку
    permission: vaulteconomy.tp

  tpa:
    description: Запрос телепорта
    permission: vaulteconomy.tpa

  tpahere:
    description: Телепорт игрока к себе
    aliases: [tph]
    permission: vaulteconomy.tpahere

  tpaaccept:
    description: Принять запрос
    aliases: [tpaccept, tpyes]
    permission: vaulteconomy.tpaaccept

  tpadeny:
    description: Отклонить запрос
    aliases: [tpdeny, tpno]
    permission: vaulteconomy.tpadeny

  # ===== УТИЛИТЫ =====
  craft:
    description: Виртуальный верстак
    aliases: [workbench, wb]
    permission: vaulteconomy.craft

  anvil:
    description: Виртуальная наковальня
    permission: vaulteconomy.anvil

  ec:
    description: Эндер-сундук
    aliases: [enderchest, echest]
    permission: vaulteconomy.enderchest

  repair:
    description: Починка предмета
    aliases: [fix]
    permission: vaulteconomy.repair

  # ===== ЧАТ =====
  clearchat:
    description: Очистка чата
    aliases: [cc]
    permission: vaulteconomy.clearchat

  filter:
    description: Фильтр чата
    permission: vaulteconomy.filter.admin

  ignore:
    description: Игнор игрока
    permission: vaulteconomy.ignore

  # ===== МОДЕРАЦИЯ =====
  heal:
    description: Лечение
    permission: vaulteconomy.heal

  feed:
    description: Утолить голод
    permission: vaulteconomy.feed

  sp:
    description: Спавн мобов
    permission: vaulteconomy.spawnmob

  # ===== АДМИН =====
  fly:
    description: Полёт
    permission: vaulteconomy.fly

  god:
    description: Режим бога
    permission: vaulteconomy.god

  gamemode:
    description: Смена режима
    aliases: [gm, gmc, gms, gma, gmsp]
    permission: vaulteconomy.gamemode

  # ===== ПРОЧЕЕ =====
  marry:
    description: Система брака
    permission: vaulteconomy.marry.use

  ah:
    description: Аукцион
    aliases: [auction, market, auc, ac]
    permission: vaulteconomy.auction

  ahelp:
    description: Помощь по аукциону
    aliases: [ahhelp, auctionhelp]
    permission: vaulteconomy.auction.help

  prefix:
    description: Управление префиксом
    usage: /prefix set <префикс> | /prefix reset
    permission: vaulteconomy.prefix

  ve:
    description: VaultEconomy admin command
    usage: /ve reload
    permission: vaulteconomy.admin


# =====================================================
#                     PERMISSIONS
# =====================================================
permissions:

  # 👤 ИГРОК
  vaulteconomy.user:
    default: true
    children:
      vaulteconomy.clan: true
      vaulteconomy.spawn: true
      vaulteconomy.back: true

      vaulteconomy.home: true
      vaulteconomy.sethome: true
      vaulteconomy.delhome: true
      vaulteconomy.homelist: true

      vaulteconomy.warp: true
      vaulteconomy.warplist: true

      vaulteconomy.tpa: true
      vaulteconomy.tpahere: true
      vaulteconomy.tpaaccept: true
      vaulteconomy.tpadeny: true

      vaulteconomy.balance: true
      vaulteconomy.baltop: true

      vaulteconomy.craft: true
      vaulteconomy.anvil: true
      vaulteconomy.enderchest: true
      vaulteconomy.repair: true

      vaulteconomy.auction: true
      vaulteconomy.auction.sell: true
      vaulteconomy.marry.use: true

  # 🛡 МОДЕР
  vaulteconomy.moderator:
    default: false
    children:
      vaulteconomy.user: true
      vaulteconomy.heal: true
      vaulteconomy.feed: true
      vaulteconomy.clearchat: true
      vaulteconomy.filter.admin: true
      vaulteconomy.ignore: true
      vaulteconomy.pvp.command.bypass: true

  # 👑 АДМИН
  vaulteconomy.admin:
    default: op
    children:
      vaulteconomy.moderator: true
      vaulteconomy.fly: true
      vaulteconomy.god: true
      vaulteconomy.gamemode: true
      vaulteconomy.spawnmob: true
      vaulteconomy.setwarp: true
      vaulteconomy.delwarp: true
      vaulteconomy.spawn.set: true
      vaulteconomy.point.admin: true
      vaulteconomy.reload: true
      vaulteconomy.pvp.bypass: true
      vaulteconomy.prefix: true